services:
  postgres:
    image: postgres:17-alpine
    container_name: onevault_postgres
    environment:
      POSTGRES_USER: onevault_owner
      POSTGRES_PASSWORD: onevault_local_dev_password
      POSTGRES_DB: onevault_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onevault_owner -d onevault_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onevault_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time migration service: runs DDL migrations before the API starts
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onevault_migrator
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://onevault_owner:onevault_local_dev_password@postgres:5432/onevault_dev
      LOG_LEVEL: info
      TRUST_PROXY: "false"
      IP_HASH_SALT: "c1f4e5a9b8d7e6f5a4b3c2d1e0f9a8b7"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onevault_api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://onevault_owner:onevault_local_dev_password@postgres:5432/onevault_dev
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      TRUST_PROXY: "false"
      IP_HASH_SALT: "c1f4e5a9b8d7e6f5a4b3c2d1e0f9a8b7"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: info
      RATE_LIMIT_GLOBAL_MAX: 100
      RATE_LIMIT_CREATE_MAX: 10
      RATE_LIMIT_STATUS_MAX: 30
      RATE_LIMIT_CONSUME_MAX: 15
      RATE_LIMIT_REVOKE_MAX: 15
      CLEANUP_INTERVAL_MS: 900000
      CLEANUP_RETENTION_HOURS: 24
    restart: unless-stopped

volumes:
  postgres_data:
